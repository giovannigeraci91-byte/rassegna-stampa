<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rassegna Stampa — Desk Intelligence</title>
<meta name="description" content="Rassegna stampa quotidiana per la direzione: geopolitica, macro, mercati, supply chain e tecnologia.">
<meta name="theme-color" content="#070c11">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rassegna">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;

  --bg:            oklch(15% .015 250);
  --surface:       oklch(20% .02 250);
  --surface-2:     oklch(23% .03 245);
  --surface-mover: oklch(24% .055 240);
  --surface-soft:  oklch(22% .025 250);

  --border:        oklch(30% .025 250);
  --border-soft:   oklch(28% .02 250);
  --border-strong: oklch(38% .04 240);
  --border-accent: oklch(46% .1 220);

  --text:          oklch(90% .008 250);
  --text-body:     oklch(84% .01 250);
  --accent:        oklch(70% .14 220);
  --meta:          oklch(55% .1 220);

  --serif: 'Lora', Georgia, 'Times New Roman', serif;
  --sans:  'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:  'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  --shell: 520px;
  --pad: 18px;
}

*, *::before, *::after{ box-sizing: border-box; }

html{ -webkit-text-size-adjust: 100%; }

body{
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-wrap: break-word;
}

/* Nothing in this document may clip, clamp or truncate text.
   Containers grow with their content; the page itself is the only scroller. */

/* ---------- browser chrome ---------- */
.chrome{
  position: sticky;
  top: 0;
  z-index: 10;
  background: color-mix(in oklab, var(--bg) 92%, black);
  border-bottom: 1px solid var(--border-soft);
  padding: 10px 0 calc(10px + env(safe-area-inset-top, 0px));
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  padding-bottom: 10px;
}
.chrome-inner{
  max-width: var(--shell);
  margin: 0 auto;
  padding: 0 var(--pad);
  display: flex;
  align-items: center;
  gap: 12px;
}
.dots{ display: flex; gap: 6px; flex: 0 0 auto; }
.dots i{
  display: block;
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--border-strong);
}
.dots i:first-child{ background: oklch(45% .07 250); }
.url-pill{
  flex: 1 1 auto;
  text-align: center;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: .01em;
  color: var(--meta);
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 999px;
  padding: 5px 14px;
  user-select: none;
}
.chrome-spacer{ flex: 0 0 34px; }

/* ---------- shell ---------- */
.shell{
  max-width: var(--shell);
  margin: 0 auto;
  padding: 0 var(--pad) calc(72px + env(safe-area-inset-bottom, 0px));
}

/* ---------- header ---------- */
.masthead{ padding: 26px 0 4px; }
.eyebrow{
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0;
}
h1{
  font-family: var(--serif);
  font-weight: 700;
  font-size: 36px;
  line-height: 1.1;
  letter-spacing: -.015em;
  color: var(--text);
  margin: 12px 0 0;
}
.deck{
  font-size: 13.5px;
  color: oklch(70% .012 250);
  margin: 12px 0 0;
  font-style: italic;
  font-family: var(--serif);
  line-height: 1.55;
}

.datebar{
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin: 20px 0 4px;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: 12px;
}
.datebar label{
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--meta);
  flex: 0 0 auto;
}
.datebar input[type="date"]{
  flex: 1 1 auto;
  min-width: 130px;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 10px;
}
.datebar input[type="date"]::-webkit-calendar-picker-indicator{
  filter: invert(58%) sepia(64%) saturate(1200%) hue-rotate(155deg);
  cursor: pointer;
}
.datebar button{
  flex: 0 0 auto;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--accent);
  background: transparent;
  border: 1px solid var(--border-accent);
  border-radius: 8px;
  padding: 7px 12px;
  cursor: pointer;
}
.datebar button:hover{ background: color-mix(in oklab, var(--accent) 12%, transparent); }
.datebar input:focus-visible, .datebar button:focus-visible{
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ---------- generic section ---------- */
.block{
  padding: 20px 0 4px;
  border-top: 1px solid var(--border-soft);
  margin-top: 16px;
}
.block:first-child{ border-top: 0; }

.sec-head{
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin: 0 0 4px;
}
.sec-num{
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .1em;
  color: var(--accent);
  flex: 0 0 auto;
}
.sec-title{
  font-family: var(--serif);
  font-weight: 600;
  font-size: 21px;
  line-height: 1.25;
  letter-spacing: -.01em;
  color: var(--text);
  margin: 0;
}

.body{
  font-size: 14.5px;
  line-height: 1.65;
  color: var(--text-body);
  margin: 14px 0 0;
}
.body strong{
  font-weight: 600;
  color: var(--text);
}
.body em{ font-style: italic; }
.body a{ color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

.src{
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 400;
  color: var(--meta);
  letter-spacing: -.005em;
  white-space: normal;
}

.bullet{
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin-top: 14px;
}
.bullet .dot{
  flex: 0 0 auto;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--accent);
  margin-top: 10px;
}
.bullet .body{ margin: 0; }

/* ---------- 01 · le tre cose ---------- */
.card-top3{
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 14px;
  padding: 18px 16px 20px;
  margin-top: 6px;
}
.card-top3 .sec-head{ margin-bottom: 6px; }

.t3-item{
  display: flex;
  gap: 14px;
  align-items: flex-start;
  padding-top: 16px;
  margin-top: 16px;
  border-top: 1px dashed var(--border);
}
.t3-item:first-of-type{
  border-top: 0;
  margin-top: 4px;
  padding-top: 8px;
}
.t3-num{
  flex: 0 0 auto;
  font-family: var(--serif);
  font-weight: 600;
  font-size: 28px;
  line-height: 1;
  color: var(--accent);
  min-width: 24px;
  padding-top: 2px;
}
.t3-body{ flex: 1 1 auto; min-width: 0; }
.t3-body .body{ margin: 0; }
.t3-src{ display: block; margin-top: 8px; }

/* ---------- agenda ---------- */
.ag-row{
  display: flex;
  gap: 14px;
  align-items: baseline;
  padding: 12px 0;
  border-top: 1px dashed var(--border);
}
.ag-row:first-of-type{ border-top: 0; }
/* Colonna data a larghezza fissa: il testo va a capo per intero,
   non viene mai accorciato né abbreviato. */
.ag-date{
  flex: 0 0 72px;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.45;
  color: var(--accent);
  letter-spacing: -.02em;
}
.ag-text{
  flex: 1 1 auto;
  min-width: 0;
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-body);
  margin: 0;
}

/* ---------- market mover ---------- */
.card-mover{
  border: 1px solid var(--border-accent);
  background: var(--surface-mover);
  border-radius: 14px;
  padding: 18px 16px 20px;
  margin-top: 6px;
}
.card-mover .sec-head{ margin-bottom: 10px; }
.mover-eyebrow{
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--accent);
}
.card-mover .body{ color: var(--text); }

/* ---------- risk sentiment ---------- */
.card-risk{
  border: 1px solid var(--border-accent);
  background: var(--surface-mover);
  border-radius: 14px;
  padding: 18px 16px 20px;
  margin-top: 6px;
}
.card-risk .sec-head{ margin-bottom: 10px; }
.risk-verdict{
  font-family: var(--serif);
  font-weight: 600;
  font-size: 16px;
  line-height: 1.35;
  color: var(--text);
}
.risk-rationale{ margin-top: 10px; color: var(--text-body); }

/* ---------- states ---------- */
.notice{
  margin: 26px 0 0;
  padding: 18px 16px;
  border: 1px dashed var(--border-strong);
  border-radius: 14px;
  background: var(--surface-soft);
}
.notice-eyebrow{
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--meta);
  margin: 0 0 8px;
}
.notice-title{
  font-family: var(--serif);
  font-weight: 600;
  font-size: 18px;
  line-height: 1.35;
  color: var(--text);
  margin: 0;
}
.notice-text{
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--text-body);
  margin: 10px 0 0;
}
.notice-detail{
  font-family: var(--mono);
  font-size: 12px;
  color: var(--meta);
  margin: 10px 0 0;
}

.loading{
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--meta);
  margin: 32px 0 0;
}

.colophon{
  margin-top: 34px;
  padding-top: 16px;
  border-top: 1px solid var(--border-soft);
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.6;
  color: var(--meta);
}

@media (min-width: 760px){
  :root{ --shell: 560px; --pad: 22px; }
  h1{ font-size: 40px; }
  .body{ font-size: 15px; }
}

@media (prefers-reduced-motion: no-preference){
  .fade-in{ animation: fade .28s ease-out both; }
  @keyframes fade{ from{ opacity: 0; transform: translateY(4px); } to{ opacity: 1; transform: none; } }
}
</style>
</head>
<body>

<div class="chrome">
  <div class="chrome-inner">
    <div class="dots" aria-hidden="true"><i></i><i></i></div>
    <div class="url-pill">rassegna.azienda.com</div>
    <div class="chrome-spacer" aria-hidden="true"></div>
  </div>
</div>

<div class="shell">
  <header class="masthead">
    <p class="eyebrow" id="eyebrow">Desk Intelligence</p>
    <h1>Rassegna Stampa</h1>
    <div class="datebar">
      <label for="datePicker">Data</label>
      <input type="date" id="datePicker" aria-label="Scegli la data della rassegna">
      <button type="button" id="todayBtn">Oggi</button>
    </div>
  </header>

  <main id="content" aria-live="polite">
    <p class="loading">Caricamento rassegna…</p>
  </main>
</div>

<script>
(function(){
  'use strict';

  var MONTHS = ['gennaio','febbraio','marzo','aprile','maggio','giugno',
                'luglio','agosto','settembre','ottobre','novembre','dicembre'];
  var DAYS = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];

  var content  = document.getElementById('content');
  var eyebrow  = document.getElementById('eyebrow');
  var picker   = document.getElementById('datePicker');
  var todayBtn = document.getElementById('todayBtn');

  /* ------------------------------------------------------------------ *
   * utils
   * ------------------------------------------------------------------ */

  function esc(s){
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* "Oggi" è sempre il giorno civile a Europe/Rome, indipendentemente dal
     fuso del dispositivo del lettore: è lo stesso calendario usato dalla
     Routine editoriale e dal workflow di pulizia dell'archivio (che usa
     TZ=Europe/Rome), così picker e archivio restano coerenti tra loro. */
  function romeISO(offsetDays){
    var parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Europe/Rome', year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(new Date()).reduce(function(acc, p){ acc[p.type] = p.value; return acc; }, {});
    var d = new Date(Date.UTC(Number(parts.year), Number(parts.month) - 1, Number(parts.day)));
    d.setUTCDate(d.getUTCDate() + (offsetDays || 0));
    return d.getUTCFullYear() + '-' +
      String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
      String(d.getUTCDate()).padStart(2, '0');
  }

  function todayISO(){ return romeISO(0); }

  /* L'archivio conserva solo oggi + 6 giorni precedenti (vedi
     .github/workflows/prune-archivio.yml): il picker non fa scegliere
     date sicuramente assenti. */
  function oldestArchivedISO(){ return romeISO(-6); }

  function capitalize(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  function labelForISO(iso){
    var p = iso.split('-');
    var y = Number(p[0]), m = Number(p[1]), day = Number(p[2]);
    var d = new Date(y, m - 1, day);
    /* new Date() normalizza silenziosamente le date impossibili (es. 31
       febbraio -> 3 marzo): il round-trip esclude questo caso invece di
       mostrare una data sbagliata. */
    var valid = !isNaN(d.getTime()) &&
      d.getFullYear() === y && d.getMonth() === m - 1 && d.getDate() === day;
    if (!valid) return iso;
    return capitalize(DAYS[d.getDay()]) + ' ' + d.getDate() + ' ' +
           capitalize(MONTHS[d.getMonth()]) + ' ' + d.getFullYear();
  }

  /* Inline markdown -> HTML. Never shortens, never drops: bold, italics,
     links and [Fonte, data] attributions are all preserved in full. */
  function inline(text){
    var t = esc(text);
    t = t.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,
      function(_, label, href){
        return '<a href="' + href + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
      });
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    t = t.replace(/\[([^\]\n]+)\]/g, '<span class="src">[$1]</span>');
    return t;
  }

  /* Splits a trailing "[Reuters, 7 ago]" attribution off the body text.
     The attribution is re-rendered as its own metadata line — kept whole. */
  function splitSource(text){
    var m = text.match(/^([\s\S]*?)\s*(\[[^\]\n]+\])\s*(\.?)\s*$/);
    if (m && m[1].trim()) return { body: m[1].trim() + m[3], source: m[2] };
    return { body: text, source: '' };
  }

  /* ------------------------------------------------------------------ *
   * markdown parsing
   * ------------------------------------------------------------------ */

  function parse(md){
    var lines = String(md).replace(/\r\n?/g, '\n').split('\n');
    var title = '';
    var intro = [];
    var sections = [];
    var cur = null;

    for (var i = 0; i < lines.length; i++){
      var line = lines[i].replace(/\s+$/, '');
      var h2 = line.match(/^##\s+(.+)$/);
      if (h2){
        cur = { heading: h2[1].trim(), lines: [] };
        sections.push(cur);
        continue;
      }
      var h1 = line.match(/^#\s+(.+)$/);
      if (h1 && !cur){
        if (!title) title = h1[1].trim();
        continue;
      }
      if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) continue;
      if (!cur){
        if (line.trim()) intro.push(line.trim());
        continue;
      }
      cur.lines.push(line);
    }

    var meta = intro.join(' ').replace(/^\*+/, '').replace(/\*+$/, '').trim();
    var tail = '';
    var tparts = title.split(/\s[—–-]\s/);
    if (tparts.length > 1) tail = tparts.slice(1).join(' — ').trim();

    var timeM = meta.match(/ore\s+(\d{1,2}[:.]\d{2})/i);

    return {
      title: title,
      dayDate: tail,
      time: timeM ? timeM[1].replace('.', ':') : '',
      meta: meta,
      sections: sections
    };
  }

  /* Groups the raw lines of a section into paragraphs and list items,
     joining wrapped continuation lines back onto their block. */
  function toBlocks(lines){
    var out = [];
    var open = null;
    for (var i = 0; i < lines.length; i++){
      var l = lines[i];
      if (!l.trim()){ open = null; continue; }
      var li = l.match(/^\s*[-*+]\s+(.+)$/);
      if (li){
        open = { type: 'li', text: li[1].trim() };
        out.push(open);
      } else if (open){
        open.text += ' ' + l.trim();
      } else {
        open = { type: 'p', text: l.trim() };
        out.push(open);
      }
    }
    return out;
  }

  /* Il numero del markdown viene scartato: la sezione è numerata in base alla
     posizione che occupa in pagina, assegnata dopo il riordino. */
  function headingTitle(heading){
    var m = heading.match(/^\d+\s*[.)]\s*(.+)$/);
    return m ? m[1].trim() : heading;
  }

  function kindOf(title){
    var n = title.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    if (/cose che contano|tre cose|3 cose/.test(n)) return 'top3';
    if (/market mover/.test(n))                     return 'mover';
    if (/risk sentiment|sentiment/.test(n))         return 'risk';
    if (/agenda/.test(n))                           return 'agenda';
    return 'standard';
  }

  /* ------------------------------------------------------------------ *
   * rendering
   * ------------------------------------------------------------------ */

  function head(parts){
    return '<div class="sec-head">' +
             '<span class="sec-num">' + esc(parts.num) + '</span>' +
             '<h2 class="sec-title">' + esc(parts.title) + '</h2>' +
           '</div>';
  }

  function paragraphs(blocks){
    var html = '';
    for (var i = 0; i < blocks.length; i++){
      var b = blocks[i];
      if (b.type === 'li'){
        html += '<div class="bullet"><span class="dot" aria-hidden="true"></span>' +
                '<p class="body">' + inline(b.text) + '</p></div>';
      } else {
        html += '<p class="body">' + inline(b.text) + '</p>';
      }
    }
    return html;
  }

  function renderStandard(parts, blocks){
    return '<section class="block">' + head(parts) + paragraphs(blocks) + '</section>';
  }

  function renderTop3(parts, blocks){
    var items = blocks.filter(function(b){ return b.type === 'li'; });
    if (!items.length) items = blocks;
    var html = '';
    for (var i = 0; i < items.length; i++){
      var s = splitSource(items[i].text);
      html += '<div class="t3-item">' +
                '<div class="t3-num" aria-hidden="true">' + (i + 1) + '</div>' +
                '<div class="t3-body">' +
                  '<p class="body">' + inline(s.body) + '</p>' +
                  (s.source ? '<span class="src t3-src">' + esc(s.source) + '</span>' : '') +
                '</div>' +
              '</div>';
    }
    return '<section class="block"><div class="card-top3">' + head(parts) + html + '</div></section>';
  }

  function renderAgenda(parts, blocks){
    var rows = '';
    for (var i = 0; i < blocks.length; i++){
      var text = blocks[i].text;
      var m = text.match(/^\*\*(.+?)\*\*\s*([\s\S]*)$/);
      if (m){
        var rest = m[2].replace(/^\s*:\s*/, '');
        rows += '<div class="ag-row">' +
                  '<div class="ag-date">' + esc(m[1]) + '</div>' +
                  '<p class="ag-text">' + inline(rest) + '</p>' +
                '</div>';
      } else {
        rows += '<div class="ag-row"><p class="ag-text">' + inline(text) + '</p></div>';
      }
    }
    return '<section class="block">' + head(parts) + rows + '</section>';
  }

  function renderMover(parts, blocks){
    return '<section class="block"><div class="card-mover">' +
             head(parts) +
             '<div class="mover-eyebrow">Da confermare nelle prossime 24h</div>' +
             paragraphs(blocks) +
           '</div></section>';
  }

  /* Estrae l'emoji iniziale del risk sentiment senza toccare il resto del testo. */
  var EMOJI = (function(){
    try {
      return new RegExp('^((?:\\p{Extended_Pictographic}|\\uFE0F|\\u200D)+)\\s*([\\s\\S]*)$', 'u');
    } catch (e) {
      return /^((?:[\uD800-\uDBFF][\uDC00-\uDFFF]|[\u2190-\u2BFF\u2600-\u27BF\u3030\u303D\uFE0F\u200D])+)\s*([\s\S]*)$/;
    }
  })();

  function renderRisk(parts, blocks){
    if (!blocks.length) return '';
    var first = blocks[0].text;
    var lead = '', rest = '';
    var m = first.match(/^\*\*(.+?)\*\*\s*([\s\S]*)$/);
    if (m){
      lead = m[1].trim();
      rest = m[2].trim();
    } else {
      var dot = first.indexOf('. ');
      lead = dot > -1 ? first.slice(0, dot + 1).trim() : first.trim();
      rest = dot > -1 ? first.slice(dot + 2).trim() : '';
    }

    var emoji = '⚠️';
    var label = lead;
    var em = lead.match(EMOJI);
    if (em && em[2].trim()){
      emoji = em[1];
      label = em[2].trim();
    }
    label = label.replace(/\s*[.;]$/, '');

    var html = head(parts) +
      '<div class="risk-verdict">' + esc(emoji) + ' ' + inline(label) + '</div>';

    if (rest) html += '<p class="body risk-rationale">' + inline(rest) + '</p>';
    html += paragraphs(blocks.slice(1));

    return '<section class="block"><div class="card-risk">' + html + '</div></section>';
  }

  /* Market mover e risk sentiment chiudono il markdown ma sono la lettura
     più urgente: vengono risaliti sopra la prima sezione numerata, subito
     sotto "Le tre cose che contano oggi". Cambia solo la posizione in pagina:
     il parsing di oggi.md e il markup delle due sezioni restano identici. */
  var LIFTED = ['mover', 'risk'];

  function arrange(entries){
    var lifted = entries.filter(function(e){ return LIFTED.indexOf(e.kind) > -1; });
    if (!lifted.length) return entries;

    lifted.sort(function(a, b){ return LIFTED.indexOf(a.kind) - LIFTED.indexOf(b.kind); });

    var rest = entries.filter(function(e){ return LIFTED.indexOf(e.kind) < 0; });
    var at = 0;
    for (var i = 0; i < rest.length; i++){
      if (rest[i].kind === 'top3'){ at = i + 1; break; }
    }
    return rest.slice(0, at).concat(lifted, rest.slice(at));
  }

  function render(doc, iso){
    var dayDate = doc.dayDate || labelForISO(iso);
    var bits = ['Desk Intelligence'];
    if (dayDate) bits.push(dayDate);
    if (doc.time) bits.push(doc.time + ' CET');
    eyebrow.textContent = bits.join(' · ');

    var entries = [];

    for (var i = 0; i < doc.sections.length; i++){
      var sec = doc.sections[i];
      var blocks = toBlocks(sec.lines);
      if (!blocks.length) continue;            /* sezione assente/vuota: non si renderizza */

      var title = headingTitle(sec.heading);
      entries.push({ kind: kindOf(title), title: title, blocks: blocks });
    }

    /* Prima si decide l'ordine, poi si numera: le sezioni portano sempre
       la loro posizione effettiva in pagina, senza salti. */
    var html = arrange(entries).map(function(e, index){
      var parts = { num: String(index + 1).padStart(2, '0'), title: e.title };

      if (e.kind === 'top3')   return renderTop3(parts, e.blocks);
      if (e.kind === 'agenda') return renderAgenda(parts, e.blocks);
      if (e.kind === 'mover')  return renderMover(parts, e.blocks);
      if (e.kind === 'risk')   return renderRisk(parts, e.blocks);
      return renderStandard(parts, e.blocks);
    }).join('');

    if (!html){
      showNotice('Rassegna', 'Contenuto non leggibile',
        'Il file della rassegna non contiene sezioni riconoscibili.');
      return;
    }

    if (doc.meta) html = '<p class="deck">' + inline(doc.meta) + '</p>' + html;
    html += '<p class="colophon">Fonte: ' + esc(doc.sourceFile) + ' · ' +
            'ultimo aggiornamento della pagina ' + esc(new Date().toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'})) + '</p>';

    content.className = 'fade-in';
    content.innerHTML = html;
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function showNotice(eyebrowText, title, text, detail){
    content.className = 'fade-in';
    content.innerHTML =
      '<div class="notice">' +
        '<p class="notice-eyebrow">' + esc(eyebrowText) + '</p>' +
        '<p class="notice-title">' + esc(title) + '</p>' +
        (text ? '<p class="notice-text">' + esc(text) + '</p>' : '') +
        (detail ? '<p class="notice-detail">' + esc(detail) + '</p>' : '') +
      '</div>';
  }

  function showLoading(){
    content.className = '';
    content.innerHTML = '<p class="loading">Caricamento rassegna…</p>';
  }

  /* ------------------------------------------------------------------ *
   * data loading
   * ------------------------------------------------------------------ */

  function looksLikeHTML(text){
    return /^\s*<(!doctype|html|head|body)/i.test(text);
  }

  function fetchMarkdown(path){
    return fetch(path, { cache: 'no-store' }).then(function(res){
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    }).then(function(text){
      if (!text.trim() || looksLikeHTML(text)) throw new Error('not-markdown');
      return text;
    });
  }

  var requestToken = 0;

  function load(iso, opts){
    opts = opts || {};
    var token = ++requestToken;
    showLoading();

    var candidates = opts.candidates || ['archivio/' + iso + '.md'];

    (function attempt(index){
      if (index >= candidates.length){
        if (token !== requestToken) return;
        if (opts.isToday){
          showNotice('Errore', 'Rassegna di oggi non disponibile',
            'Non è stato possibile caricare il file oggi.md. Verifica che il file sia presente e riprova.',
            'oggi.md non raggiungibile');
        } else {
          showNotice('Archivio', 'Rassegna non disponibile per questa data',
            'Per ' + labelForISO(iso).toLowerCase() + ' non risulta pubblicata alcuna rassegna in archivio.');
        }
        return;
      }

      var path = candidates[index];
      fetchMarkdown(path).then(function(text){
        if (token !== requestToken) return;
        var doc;
        try {
          doc = parse(text);
        } catch (e){
          showNotice('Errore', 'Rassegna non leggibile',
            'Il contenuto del file non ha il formato atteso.', String(e && e.message || e));
          return;
        }
        if (!doc.sections.length){
          showNotice('Errore', 'Rassegna non leggibile',
            'Il file è stato caricato ma non contiene le sezioni della rassegna.', path);
          return;
        }
        doc.sourceFile = path;
        try {
          render(doc, iso);
        } catch (e){
          showNotice('Errore', 'Impossibile visualizzare la rassegna',
            'Si è verificato un problema durante la composizione della pagina.',
            String(e && e.message || e));
        }
      }).catch(function(){
        if (token !== requestToken) return;
        attempt(index + 1);
      });
    })(0);
  }

  function loadToday(){
    var iso = todayISO();
    picker.value = iso;
    load(iso, { isToday: true, candidates: ['oggi.md', 'archivio/' + iso + '.md'] });
  }

  picker.max = todayISO();
  picker.min = oldestArchivedISO();

  picker.addEventListener('change', function(){
    var iso = picker.value;
    if (!iso) return;
    if (iso === todayISO()){
      load(iso, { isToday: true, candidates: ['oggi.md', 'archivio/' + iso + '.md'] });
    } else {
      load(iso, { candidates: ['archivio/' + iso + '.md'] });
    }
  });

  todayBtn.addEventListener('click', loadToday);

  loadToday();

  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){ /* installabilità best-effort */ });
    });
  }
})();
</script>
</body>
</html>
